<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;

        }
        body{
            margin: 0px;
            
        }
        #container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 80px 250px 250px 80px;
            gap: 15px;
            width: 90%;
            margin: 30px auto;
        }
        .header{
            background-color: orange;
            grid-column: 1 / 4;
            display: flex;
            justify-content: center;
            color: white;
            align-items: center;
        }
        .sidebar{
            background-color: orangered;
            grid-row: 2 /4;
            justify-content: center;
            display: flex;
            color: white;
            align-items: center;

        }
        .content_1{
            background-color: red;
            grid-column: 2 /4;
             display: flex;
            justify-content: center;
            color: white;
            align-items: center;
        }
        .content_2{
            background-color: purple;
             display: flex;
            justify-content: center;
            color: white;
            align-items: center;
        }
        .content_3{
            background-color: violet;
             display: flex;
            justify-content: center;
            color: white;
            align-items: center;
        }
        .footer{
            background-color: orange;
            grid-column: 1 / 4;
             display: flex;
            justify-content: center;
            color: white;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="header">header</div>
        <div class="sidebar">sidebar</div>
        <div class="content_1">content1</div>
        <div class="content_2">content2</div>
        <div class="content_3">content3</div>
        <div class="footer">footer</div>
    </div>
</body>
</html>
