<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #fde2e4;" >
    <h1 align="center">Student Registration Form</h1>
           <table align="center">
            <FORm>
                <tr>
                    <td><label for="text">Roll no :</label></td>
                    <td><input name="text" type="text"></td>
                     </tr>
                     <tr>
                    <td><label for="text">Student name : </label></td>
                    <td><input name="text" type="text" placeholder="Enter Your Name"></td> <br>
                 </tr>
                 <tr>
                    <td><label for="text">Father'name :</label></td>
                    <td><input name="text" type="text"></td>
                 </tr>
                 <tr>
                    <td><label for="text"> Date of brith :</label></td>
                    <td><input type="text" name="DAY" size="5px" placeholder="Day">
                        <input type="text" name="MONTH" size="5px" placeholder="month">
                        <input type="text" name="YEAR" size="5px" placeholder="Year"></td>
                 </tr>
                 <tr>
                    <td><label for="text">Mobile no :</label></td>
                    <td>
                        <input type="text" name="india_code" value="+91" size="2px">
                        <input type="ph" name="mobile_num">
                    </td>
                 </tr>
                 <tr>
                    <td><label for="text">Email id :</label></td>
                    <td><input type="text" name="address"></td>
                 </tr>
                 <tr>
                    <td><label for="text">Password :</label></td>
                    <td><input type="text" name="six_digits"></td>
                 </tr>
                 <tr>
                    <td><label for="text">Gender :</label></td>
                    <td><input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label></td>
                 </tr>
                 <tr>
                    <td rowspan="2"><label for="text">Department :</label></td>
                    <td><input type="radio" id="CSE" name="dpart" value="CSE">
                        <label for="cse">CSE</label>
                        <input type="radio" id="IT" name="dpart" value="IT">
                        <label for="it">IT</label>
                        <input type="radio" id="ECE" name="dpart" value="ECE">
                        <label for="ece">ECE</label></td>
                 </tr>
                 <tr>
                        <td><input type="radio" id="Civil" name="dpart" value="Civil">
                        <label for="civil">Civil</label>
                        <input type="radio" id="Mech" name="dpart" value="Mech">
                        <label for="Mech">Mech</label></td>
                 </tr>
                 <tr>
                    <td><label for="text">Course :</label></td>
                     <td>
                        <select name="course">
                            <option value="">------Select Current Course's------</option>
                            <option value="bca">BCA</option>
                            <option value="be">B.E</option>
                            <option value="aids">AIDS</option>
                            <option value="b.com">B.COM</option>
                        </select>
                     </td>
                       </tr>
                       <tr>
                        <td><label for="text">Student photo :</label></td>
                        <td><input type="text" name="Choose File" placeholder="Choose File" size="7px">
                        </td>
                       </tr>
                       <tr>
                        <td><label for="text">City :</label></td>
                        <td><input type="text"></td>
                       </tr>
                       <tr>
                        <td><label for="addressing">Addrees :</label></td>
                        <td><textarea name="adress" rows="3" cols="30"></textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center"><br>
                        <input type="submit" value="Register"></td>

                        
                    </tr>
            </FORm>

           </table>
        
</body>
</html>
